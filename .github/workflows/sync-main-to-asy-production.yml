name: Sync main to asy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-sync-pr:
    name: Open PR main -> asy-production
    runs-on: ubuntu-latest
    steps:
      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync main into asy-production"
          title: "chore: sync main into asy-production"
          body: |
            Automated sync PR from main to asy-production.

            This PR is created automatically after pushes to main.
            Merge is still controlled by branch protection and required checks.
          branch: automation/sync-main-to-asy-production
          base: asy-production
          labels: |
            automation
            release-sync
          delete-branch: true
